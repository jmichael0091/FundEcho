<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Top Green-to-Blue Ribbon Gradient -->
    <linearGradient id="topGreenBlueGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="25%" stop-color="#22C55E" />
      <stop offset="55%" stop-color="#06B6D4" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Top Ribbon Highlight -->
    <linearGradient id="topHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Middle Arm Blue Gradient -->
    <linearGradient id="midBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="45%" stop-color="#0077F7" />
      <stop offset="85%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#003EAA" />
    </linearGradient>

    <!-- Middle Arm Highlight -->
    <linearGradient id="midHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Vertical Stem Blue Ribbon Gradient -->
    <linearGradient id="stemBlueGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="30%" stop-color="#0077E6" />
      <stop offset="70%" stop-color="#0050C8" />
      <stop offset="100%" stop-color="#002D8C" />
    </linearGradient>

    <!-- Stem Outer Edge Bevel -->
    <linearGradient id="stemEdgeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00144D" stop-opacity="0.6" />
    </linearGradient>

    <!-- Globe Ocean Radial Gradient -->
    <radialGradient id="globeOcean" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#034596" />
      <stop offset="100%" stop-color="#01245E" />
    </radialGradient>

    <!-- Globe Specular Shine -->
    <radialGradient id="globeShine" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Echo Waves Gradient -->
    <linearGradient id="echoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="40%" stop-color="#4ADE80" />
      <stop offset="80%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Echo Waves Bevel Highlight -->
    <linearGradient id="echoHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#001F5C" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Group for Logo with subtle 3D depth -->
  <g id="fundEchoLogoGroup">

    <!-- 1. TOP CURVED "F" RIBBON (Green to Blue) -->
    <path
      d="M 80,240 
         C 80,140 140,50 240,48 
         C 330,46 410,50 445,55 
         C 455,57 458,68 450,75 
         C 400,120 330,138 230,142 
         C 160,144 110,180 80,240 Z"
      fill="url(#topGreenBlueGrad)"
      filter="url(#softShadow)"
    />
    <!-- Top Ribbon Gloss Highlight -->
    <path
      d="M 86,220 
         C 88,145 142,60 238,56 
         C 328,52 405,56 438,62 
         C 370,85 270,115 180,150 
         C 130,170 102,195 86,220 Z"
      fill="url(#topHighlight)"
    />

    <!-- 2. MIDDLE HORIZONTAL "F" BAR (Cyan to Royal Blue) -->
    <path
      d="M 125,230 
         C 140,185 190,172 260,172 
         L 400,172 
         C 416,172 426,186 422,202 
         C 418,218 406,242 388,245 
         C 310,246 220,248 150,285 
         C 138,292 122,275 125,230 Z"
      fill="url(#midBlueGrad)"
      filter="url(#softShadow)"
    />
    <!-- Middle Bar Upper Bevel Highlight -->
    <path
      d="M 140,215 
         C 180,180 230,176 300,176 
         L 402,176 
         C 412,180 415,190 410,200 
         L 280,200 
         C 210,200 160,215 140,215 Z"
      fill="url(#midHighlight)"
    />

    <!-- 3. MAIN VERTICAL / SPIRAL STEM (Blue Ribbon sweeping around globe) -->
    <path
      d="M 80,230 
         C 80,310 105,400 170,455 
         C 200,480 235,475 232,458 
         C 225,430 190,400 178,355 
         C 160,290 180,240 220,200 
         C 160,200 105,205 80,230 Z"
      fill="url(#stemBlueGrad)"
      filter="url(#softShadow)"
    />
    <!-- Stem Outer Edge 3D Highlight Curve -->
    <path
      d="M 82,240 
         C 84,315 108,395 168,448 
         C 155,420 135,370 132,320 
         C 128,270 145,230 175,208 
         C 130,212 95,220 82,240 Z"
      fill="url(#stemEdgeBevel)"
    />

    <!-- 4. 3D GLOSS EARTH GLOBE -->
    <g id="globeGroup" transform="translate(244, 362)">
      <!-- Ocean Sphere -->
      <circle cx="0" cy="0" r="91" fill="url(#globeOcean)" filter="url(#softShadow)" />

      <!-- Continents (Detailed Vector Landmasses) -->
      <!-- Africa & Europe -->
      <path
        d="M -15,-65 
           C -8,-68 12,-70 18,-60 
           C 22,-52 14,-42 22,-36 
           C 28,-30 40,-32 44,-20 
           C 48,-8 38,10 40,25 
           C 42,42 22,65 14,68 
           C 5,72 -6,55 -10,40 
           C -15,22 -30,8 -28,-10 
           C -26,-28 -22,-38 -15,-48 
           C -12,-55 -22,-62 -15,-65 Z"
        fill="#E0F2FE"
        opacity="0.95"
      />
      <!-- Mediterranean / Middle East / Madagascar -->
      <path
        d="M 28,32 C 34,30 36,45 32,52 C 28,58 24,45 28,32 Z"
        fill="#BAE6FD"
      />
      <path
        d="M 22,-45 C 32,-48 38,-38 32,-32 C 26,-28 18,-38 22,-45 Z"
        fill="#BAE6FD"
      />
      <!-- Western Coast / Americas Edge -->
      <path
        d="M -75,-35 
           C -65,-50 -50,-55 -40,-45 
           C -32,-38 -45,-20 -40,-5 
           C -35,10 -48,32 -60,45 
           C -70,55 -80,40 -82,25 
           C -85,10 -82,-20 -75,-35 Z"
        fill="#E0F2FE"
        opacity="0.92"
      />
      <!-- Northern Landmasses (Eurasia / Greenland) -->
      <path
        d="M -35,-68 
           C -20,-78 2,-78 20,-75 
           C 15,-68 -10,-65 -25,-62 Z"
        fill="#BAE6FD"
        opacity="0.9"
      />
      <!-- Southern Polar Ice / Antarctica Cap -->
      <path
        d="M -45,78 
           C -20,86 10,86 35,78 
           C 20,72 -25,72 -45,78 Z"
        fill="#F0F9FF"
        opacity="0.95"
      />

      <!-- Globe 3D Glass Surface Lighting -->
      <circle cx="0" cy="0" r="91" fill="url(#globeShine)" />
      <!-- Globe Rim Atmosphere Ring -->
      <circle
        cx="0"
        cy="0"
        r="90"
        fill="none"
        stroke="#38BDF8"
        stroke-width="2.5"
        opacity="0.6"
      />
    </g>

    <!-- 5. BROADCAST / ECHO WAVES (Vibrant Green Curves) -->
    <!-- Inner Echo Wave -->
    <path
      d="M 315,268 
         C 355,295 378,340 378,390 
         C 378,435 358,470 322,492"
      fill="none"
      stroke="url(#echoGrad)"
      stroke-width="22"
      stroke-linecap="round"
      filter="url(#softShadow)"
    />
    <!-- Inner Wave Specular Shine -->
    <path
      d="M 315,268 
         C 355,295 378,340 378,390 
         C 378,435 358,470 322,492"
      fill="none"
      stroke="url(#echoHighlight)"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.75"
    />

    <!-- Outer Echo Wave -->
    <path
      d="M 370,265 
         C 418,298 446,350 446,408 
         C 446,458 420,498 378,520"
      fill="none"
      stroke="url(#echoGrad)"
      stroke-width="22"
      stroke-linecap="round"
      filter="url(#softShadow)"
    />
    <!-- Outer Wave Specular Shine -->
    <path
      d="M 370,265 
         C 418,298 446,350 446,408 
         C 446,458 420,498 378,520"
      fill="none"
      stroke="url(#echoHighlight)"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.75"
    />

  </g>
</svg>
